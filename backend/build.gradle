plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.factorypick'
version = '0.0.1-SNAPSHOT'

springBoot {
    mainClass = 'com.factorypick.api.FactoryPickApplication'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-crypto'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('retryGeocoding', JavaExec) {
    description = 'Retry NOT_FOUND factory addresses, backing up changes and reporting progress.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.factorypick.api.tools.RetryGeocoding'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
