spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: factorypick-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/factorypick?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

factorypick:
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin1234}
    token-hours: ${ADMIN_TOKEN_HOURS:8}
  public-data:
    base-url: https://apis.data.go.kr/B550624/fctryRegistInfo
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    page-size: ${DATA_GO_KR_PAGE_SIZE:100}
    response-type: json
