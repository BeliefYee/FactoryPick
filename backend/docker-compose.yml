services:
  mysql:
    image: mysql:8.4
    container_name: factorypick-mysql
    environment:
      MYSQL_DATABASE: factorypick
      MYSQL_ROOT_PASSWORD: "1234"
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - factorypick_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  factorypick_mysql:
